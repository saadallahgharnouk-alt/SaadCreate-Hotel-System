<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="SaadCreate Hotel logo">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E6C88A"/>
      <stop offset="50%" stop-color="#C8A35A"/>
      <stop offset="100%" stop-color="#8C6B2E"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F2236"/>
      <stop offset="100%" stop-color="#0B1B2B"/>
    </linearGradient>
  </defs>
  <!-- Shield -->
  <path d="M60 6 L108 20 V58 C108 86 86 108 60 114 C34 108 12 86 12 58 V20 Z"
        fill="url(#navy)" stroke="url(#gold)" stroke-width="2.5"/>
  <!-- Inner thin border -->
  <path d="M60 14 L100 25 V58 C100 82 82 101 60 106 C38 101 20 82 20 58 V25 Z"
        fill="none" stroke="url(#gold)" stroke-width="0.8" opacity="0.6"/>
  <!-- Stylised "S" monogram -->
  <path d="M77 42
           C77 34 70 30 60 30
           C50 30 43 34 43 42
           C43 50 50 52 60 54
           C70 56 77 58 77 66
           C77 74 70 78 60 78
           C50 78 43 74 43 66"
        fill="none" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>
  <!-- Crown notch -->
  <path d="M48 22 L54 18 L60 22 L66 18 L72 22 L72 26 L48 26 Z" fill="url(#gold)"/>
  <!-- Star -->
  <circle cx="60" cy="90" r="2.2" fill="url(#gold)"/>
</svg>
